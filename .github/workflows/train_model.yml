name: Train Baseline ML Model

on:
  workflow_run:
    workflows: ["Generate Point-in-Time Features"]
    types:
      - completed
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install ML Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyarrow numpy scikit-learn

    - name: Train Logistic Regression Baseline
      run: python train_baseline.py

    - name: Commit and Push Model Results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add research_results/
        git diff --staged --quiet || (git commit -m "Auto-train baseline ML model [skip ci]" && git push)
