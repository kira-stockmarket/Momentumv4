name: Generate Nifty 100 Event Labels

on:
  workflow_run:
    workflows: ["Update Nifty 100 OHLCV Data"]
    types:
      - completed
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-labels:
    runs-on: ubuntu-latest
    
    # Only run automatically if the data download job was successful
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyarrow numpy

    - name: Run Data QA and Label Engine
      run: python build_labels.py

    - name: Commit and Push Labeled Datasets
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add the labeled data directory
        git add nifty100_labels/
        
        # Commit and push only if changes exist
        git diff --staged --quiet || (git commit -m "Auto-generate research event labels [skip ci]" && git push)
