name: Run 45-Day Institutional Pipeline

on:
  workflow_dispatch: # Run manually from the Actions tab

jobs:
  execute-45d-shift:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyarrow numpy scikit-learn xgboost lightgbm catboost

    - name: 1. Apply 45-Day Targets to Feature Store
      run: python add_45d_targets.py

    - name: 2. Train 45-Day Embargoed Heavy Ensemble
      run: python train_ensemble_wf.py

    - name: 3. Run 45-Day Portfolio Backtest
      run: python portfolio_backtest.py

    - name: Commit All 45-Day Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add nifty100_features/ research_results/
        git diff --staged --quiet || (git commit -m "Execute 45-day momentum shift & backtest [skip ci]" && git push)
