name: Update Nifty 100 OHLCV Data

on:
  schedule:
    # Runs at 11:30 AM UTC (5:00 PM IST) Monday through Friday
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger the run from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest

    # Needs explicit permissions to push code back to the repo
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas
        
    - name: Fetch and Update Data
      run: python fetch_nifty100.py
      
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add the data folder
        git add nifty100_data/
        
        # Check if there are any changes to commit; if yes, commit and push
        git diff --staged --quiet || (git commit -m "Auto-update Nifty 100 OHLCV data" && git push)
