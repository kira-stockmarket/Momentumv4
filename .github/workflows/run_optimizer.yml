name: Run Portfolio Parameter Optimizer

on:
  workflow_dispatch: 

jobs:
  optimize-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyarrow numpy scikit-learn xgboost lightgbm catboost

    - name: Run Multi-Core Grid Search Optimizer
      run: python optimize_portfolio.py

    - name: Commit Optimization Results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add nifty100_features/ research_results/
        git diff --staged --quiet || (git commit -m "Run portfolio parameter sweep [skip ci]" && git push)
