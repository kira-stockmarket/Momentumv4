name: Run Institutional Portfolio Backtest

on:
  workflow_run:
    workflows: ["Train Heavy Ensemble Model"]
    types:
      - completed
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  simulate-portfolio:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyarrow numpy scikit-learn xgboost lightgbm catboost

    - name: Run Portfolio Simulation
      run: python portfolio_backtest.py

    - name: Commit Backtest Deliverables
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add research_results/
        git diff --staged --quiet || (git commit -m "Auto-generate portfolio simulation & ledger [skip ci]" && git push)
