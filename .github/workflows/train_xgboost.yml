name: Train XGBoost Walk-Forward Model

on:
  workflow_dispatch: # Run this manually from the Actions tab

jobs:
  train-heavy-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install ML Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas pyarrow numpy scikit-learn xgboost

    - name: Run XGBoost Walk-Forward Engine
      run: python train_xgboost_wf.py

    - name: Commit and Push Model Results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add research_results/
        git diff --staged --quiet || (git commit -m "Auto-train XGBoost WF model [skip ci]" && git push)
