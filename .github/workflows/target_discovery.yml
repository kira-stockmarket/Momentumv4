name: Run Target Discovery Sweep

on:
  workflow_dispatch: 

jobs:
  discover-targets:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy lightgbm scikit-learn pyarrow yfinance xgboost catboost

    - name: Execute Target Discovery
      run: |
        python target_discovery_sweep.py
